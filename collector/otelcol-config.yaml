# otelcol-contrib config: receives MedLog events as OTLP logs from the Flask event receiver
# (event-receiver/app.py, which validates against schemas/openapi.yaml and sets gen_ai.*/medlog.* log
# attributes) and writes them to ClickHouse. Runs as the medlog-otelcol service in
# docker-compose.yml, alongside ClickStack, connecting directly to ClickStack's ch-server.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # Durable, crash-safe queue backing the exporter's sending_queue below -
  # this is the "write-behind caching" durability the MedLog paper calls for.
  file_storage/medlog:
    directory: /var/lib/otelcol/file_storage
    compaction:
      on_start: true

receivers:
  # event-receiver/app.py sends validated MedLog events here as OTLP logs (HTTP/protobuf).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Tags every log so the standard otel_logs-style table can attribute rows to this pipeline;
  # per-event medlog.*/gen_ai.* attributes are already set by event-receiver/app.py before OTLP export.
  resource/medlog:
    attributes:
      - key: service.name
        value: medlog-collector
        action: upsert

exporters:
  clickhouse:
    endpoint: tcp://ch-server:9000?dial_timeout=10s
    database: medlog
    logs_table_name: medlog_events
    create_schema: false # schema is owned by clickhouse/ddl/*.sql
    async_insert: true
    compress: lz4
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 4
      storage: file_storage/medlog # persistent queue: survives a collector crash/restart
      block_on_overflow: true # apply backpressure instead of dropping events
      batch:
        min_size: 500
        flush_timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [health_check, file_storage/medlog]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/medlog]
      exporters: [clickhouse]
